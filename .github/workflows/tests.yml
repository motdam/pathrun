name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          python-version: "3.13"
      # --locked fails if uv.lock has drifted from pyproject.toml, rather than
      # quietly resolving something different from what runs locally.
      - run: uv sync --locked
      - run: uv run pytest -q
