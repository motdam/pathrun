[project]
name = "pathrun"
version = "0.1.0"
description = "Footpath-aware circular running route finder for the UK"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "folium>=0.20.0",
    "gpxpy>=1.6.2",
    "osmnx>=2.1.1",
    "python-dotenv>=1.2.3",
    "scikit-learn>=1.9.0",
]

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "matplotlib>=3.11.1",
    "nbstripout>=0.9.1",
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pathrun"]
